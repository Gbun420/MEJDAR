# MEJDAR — Local Development Docker Compose
# Usage: docker compose up -d

services:
  # ─── Nginx Web Server ───────────────────────────────────────────────
  nginx:
    image: nginx:stable-alpine
    container_name: mejdar-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./apps/restaurant:/var/www/html
      - ./infra/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - mejdar
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ─── PHP-FPM Application ───────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile.dev
    container_name: mejdar-app
    restart: unless-stopped
    volumes:
      - ./apps/restaurant:/var/www/html
      - ./packages:/var/www/packages
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-mejdar}
      - DB_USERNAME=${DB_USERNAME:-mejdar}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-null}
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - MAIL_USERNAME=null
      - MAIL_PASSWORD=null
      - MAIL_ENCRYPTION=null
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mejdar
    healthcheck:
      test: ["CMD-SHELL", "php -r 'echo \"ok\";' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─── MySQL Database ─────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: mejdar-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-mejdar}
      MYSQL_USER: ${DB_USERNAME:-mejdar}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    networks:
      - mejdar
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Redis Cache ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mejdar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - mejdar
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Queue Worker ──────────────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile.dev
    container_name: mejdar-queue
    restart: unless-stopped
    command: >
      sh -c "php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600"
    volumes:
      - ./apps/restaurant:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-mejdar}
      - DB_USERNAME=${DB_USERNAME:-mejdar}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-null}
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - QUEUE_CONNECTION=redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mejdar

  # ─── Scheduler ─────────────────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile.dev
    container_name: mejdar-scheduler
    restart: unless-stopped
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    volumes:
      - ./apps/restaurant:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-mejdar}
      - DB_USERNAME=${DB_USERNAME:-mejdar}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-null}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mejdar

  # ─── Mailpit (Local Email Catcher) ─────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: mejdar-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - mejdar

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  mejdar:
    driver: bridge
